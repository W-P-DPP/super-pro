interface:
  display_name: "前端设计守卫"
  short_description: "先读 design.md 和主题源，强制复用 shared-ui、共享类型和公共样式，并验收移动端、双主题与浮层位置。"
  default_prompt: "在本仓库进行前端工作时使用 $frontend-design-guard。先读取仓库根目录 design.md，然后检查目标前端项目是否提供 theme.css；如果有，优先使用它作为主题来源；如果没有，再回退到 skill 自带的默认主题参考。修改页面、组件或表单前必须解析 shared-ui、shared-types、shared-styles、shared-web 的真实 package、exports 和目标项目依赖，优先使用公共组件库的语义组件；日期、时间、枚举、开关等字段不能只用基础 Input 绕过已有选择器。Select、Combobox、DropdownMenu、Popover、DatePicker 等浮层必须检查 side、align、sideOffset、z-index、滚动和碰撞翻转，常规下拉选择器不得默认覆盖触发器。除非用户明确要求，否则保持界面克制简洁，默认使用简体中文文案，将 API 请求集中在项目 API 模块中，保持后端响应包络兼容，并在 401/403 时正确处理登录跳转。交付前验收公共组件使用、共享类型和样式引用、浮层位置、移动端、双主题与必要构建或测试。"

policy:
  allow_implicit_invocation: true
